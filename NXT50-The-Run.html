<!DOCTYPE html>
<html>
<head>
<title>NXT50: The Run</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0b0b0f;color:white;font-family:Arial;text-align:center;overflow:hidden}
h1{font-size:40px}
#game{width:95%;max-width:900px;height:350px;margin:auto;background:#151522;border:3px solid #5865f2;border-radius:15px;position:relative;overflow:hidden}
#player{width:35px;height:35px;background:#5865f2;position:absolute;left:80px;bottom:0;border-radius:8px}
#ground{position:absolute;bottom:0;width:100%;height:5px;background:white}
.obstacle{width:25px;height:55px;background:#ff4757;position:absolute;bottom:0}
button{padding:12px 25px;background:#5865f2;color:white;border:0;border-radius:10px}
</style>
</head>
<body>
<h1>⚡ NXT50: The Run ⚡</h1>
<p>Celebrating 50 Discord Members</p>
<div id="score">Score: 0</div>
<div id="game"><div id="player"></div><div id="ground"></div></div>
<p id="msg">Space or tap to jump</p>
<button onclick="location.reload()">Restart</button>
<script>
const p=document.getElementById("player"),g=document.getElementById("game"),s=document.getElementById("score"),m=document.getElementById("msg");
let jump=false,alive=true,y=0,score=0;
function j(){if(jump||!alive)return;jump=true;let u=setInterval(()=>{y+=8;p.style.bottom=y+"px";if(y>=130){clearInterval(u);let d=setInterval(()=>{y-=8;p.style.bottom=y+"px";if(y<=0){y=0;jump=false;clearInterval(d)}},20)}},20)}
document.addEventListener("keydown",e=>{if(e.code=="Space")j()});document.addEventListener("touchstart",j);
setInterval(()=>{if(!alive)return;let o=document.createElement("div");o.className="obstacle";g.appendChild(o);let x=900;let t=setInterval(()=>{x-=6;o.style.left=x+"px";let a=p.getBoundingClientRect(),b=o.getBoundingClientRect();if(a.left<b.right&&a.right>b.left&&a.bottom>b.top&&a.top<b.bottom){alive=false;m.innerHTML="💀 Game Over"}if(x<-40){o.remove();clearInterval(t);score++;s.innerHTML="Score: "+score}},20)},1600);
</script>
</body>
</html>
