<!DOCTYPE html>
<html><head><title>NXT50: The Run</title></head>
<body style="background:#07070b;color:white;text-align:center;font-family:Arial">
<h1>⚡ NXT50: THE RUN ⚡</h1>
<p>50 MEMBERS SPECIAL</p>
<h2>Score: <span id="s">0</span></h2>
<div id="g" style="margin:auto;width:90%;height:350px;background:#111;border:3px solid #5865f2;position:relative;overflow:hidden">
<div id="p" style="position:absolute;width:40px;height:40px;background:#5865f2;bottom:0;left:80px"></div></div>
<script>
let p=document.getElementById('p'),g=document.getElementById('g'),s=document.getElementById('s'),y=0,v=0,score=0;
document.onkeydown=e=>{if(e.code=='Space'&&y==0)v=14};
function loop(){v-=.7;y+=v;if(y<0)y=0,v=0;p.style.bottom=y+'px';requestAnimationFrame(loop)}loop();
setInterval(()=>{let o=document.createElement('div');o.style='position:absolute;bottom:0;width:30px;height:60px;background:red;left:100%';g.appendChild(o);let x=g.clientWidth;let m=setInterval(()=>{x-=6;o.style.left=x+'px';let a=p.getBoundingClientRect(),b=o.getBoundingClientRect();if(a.left<b.right&&a.right>b.left&&a.bottom>b.top)alert('GAME OVER');if(x<0){o.remove();clearInterval(m);score++;s.innerHTML=score}},20)},1500);
</script></body></html>
